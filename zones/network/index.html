<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌐 Chế độ Mạng — BioLab X</title>
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/zone-shared.css">
  <link rel="stylesheet" href="../../styles/platform.css">
  <style>
    .leaderboard-container {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
    }
    .leaderboard-row {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: var(--transition-fast);
    }
    .leaderboard-row:hover {
      background: rgba(255,255,255,0.03);
    }
    .rank-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      margin-right: 16px;
    }
    .rank-1 { background: linear-gradient(135deg, #FFD700, #FDB931); color: #000; }
    .rank-2 { background: linear-gradient(135deg, #E0E0E0, #9E9E9E); color: #000; }
    .rank-3 { background: linear-gradient(135deg, #CD7F32, #A0522D); color: #fff; }
    .rank-other { background: rgba(255,255,255,0.1); color: var(--color-text-dim); }
    
    .project-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }
    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      margin-top: 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gradient-network);
    }
  </style>
</head>
<body class="zone-page">
  <nav class="navbar scrolled" id="navbar">
    <a href="../../index.html" class="navbar-brand">
      <div class="navbar-logo-icon">🧬</div><span class="navbar-logo">BioLab</span>
    </a>
    <ul class="navbar-links">
      <li><a href="../../index.html">Trang Chủ</a></li>
      <li><a href="../../dashboard.html">Bảng điều khiển</a></li>
      <li><a href="#" class="active">Chế độ Mạng</a></li>
    </ul>
  </nav>

  <div class="zone-header" style="padding-top: 150px; text-align: center;">
    <div class="container">
      <div class="zone-badge" style="background:rgba(68,138,255,0.1);color:var(--color-network);border-color:rgba(68,138,255,0.3);">🌐 Liên Trường - Liên Tỉnh</div>
      <h1 class="zone-title">Cộng Đồng Khoa Học Quốc Gia</h1>
      <p class="zone-desc" style="max-width: 600px; margin: 0 auto;">
        Cùng nhau nghiên cứu, thi đua và giải quyết các bài toán lớn của đất nước.
      </p>
    </div>
  </div>

  <main class="container" style="margin-top: var(--space-2xl);">
    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-xl);">
      
      <!-- Leaderboards -->
      <div>
        <div style="display:flex;gap:10px;margin-bottom:var(--space-md);">
          <button class="btn-teacher" style="background:var(--color-network);color:#fff;" onclick="loadLeaderboard('school')">🏫 Bảng Xếp Hạng Trường</button>
          <button class="btn-outline-teacher" style="border-color:var(--color-network);color:var(--color-network);" onclick="loadLeaderboard('province')">🗺️ Bảng Xếp Hạng Tỉnh</button>
        </div>
        
        <div class="leaderboard-container">
          <div id="lbContent"></div>
        </div>
      </div>

      <!-- Inter-school Projects -->
      <div>
        <h3 style="color:var(--color-light);margin-bottom:var(--space-md);">🤝 Dự Án Liên Trường</h3>
        <div id="projectsContent"></div>
      </div>
      
    </div>
  </main>

  <script src="../../scripts/network-mode.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadLeaderboard('school');
      loadProjects();
    });

    function loadLeaderboard(type) {
      const data = BioLabNetwork.getLeaderboard(type);
      let html = '';
      data.forEach(item => {
        const rankClass = item.rank === 1 ? 'rank-1' : item.rank === 2 ? 'rank-2' : item.rank === 3 ? 'rank-3' : 'rank-other';
        html += `
          <div class="leaderboard-row">
            <div class="rank-badge ${rankClass}">${item.rank}</div>
            <div style="flex:1;">
              <div style="font-weight:700;color:var(--color-light);">${item.name}</div>
              <div style="font-size:0.8rem;color:var(--color-text-dim);">${item.province || 'Toàn quốc'}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:800;color:var(--color-network);">${item.score.toLocaleString()} XP</div>
              <div style="font-size:0.75rem;color:var(--color-text-muted);">${item.students ? item.students + ' HS' : ''}</div>
            </div>
          </div>
        `;
      });
      document.getElementById('lbContent').innerHTML = html;
    }

    function loadProjects() {
      const projects = BioLabNetwork.getActiveProjects();
      let html = '';
      projects.forEach(p => {
        html += `
          <div class="project-card">
            <div style="font-weight:700;color:var(--color-light);margin-bottom:8px;">${p.title}</div>
            <div style="font-size:0.8rem;color:var(--color-text-muted);margin-bottom:8px;">🏫 ${p.schools.join(', ')}</div>
            <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:var(--color-text-dim);">
              <span>👥 ${p.participants} TV</span>
              <span style="color:var(--color-network);">${p.progress}%</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${p.progress}%"></div>
            </div>
          </div>
        `;
      });
      document.getElementById('projectsContent').innerHTML = html;
    }
  </script>
</body>
</html>
