<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Metaverse STEM — BioLab X</title>
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../../styles/zone-shared.css">
  <style>
    body { margin: 0; overflow: hidden; background: #050510; }
    #metaverseCanvas {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 1;
    }
    .metaverse-ui {
      position: relative;
      z-index: 10;
      pointer-events: none; /* Let clicks pass through to 3D canvas */
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--space-xl);
    }
    .ui-top {
      display: flex;
      justify-content: space-between;
      pointer-events: auto;
    }
    .ui-bottom {
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }
    .meta-badge {
      background: rgba(234, 128, 252, 0.15);
      border: 1px solid rgba(234, 128, 252, 0.3);
      color: var(--color-meta);
      padding: 8px 16px;
      border-radius: var(--radius-full);
      font-weight: 800;
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
    }
    .control-panel {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      gap: 16px;
    }
    .control-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .control-btn:hover {
      background: var(--color-meta);
      border-color: var(--color-meta);
    }
    #infoBox {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,14,39,0.9);
      border: 1px solid var(--color-meta);
      border-radius: var(--radius-lg);
      padding: 24px;
      color: #fff;
      text-align: center;
      display: none;
      pointer-events: auto;
      box-shadow: 0 0 40px rgba(234, 128, 252, 0.2);
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  
  <canvas id="metaverseCanvas"></canvas>

  <div class="metaverse-ui">
    <div class="ui-top">
      <div class="meta-badge">🌌 BioLab Metaverse</div>
      <a href="../../index.html" class="control-btn" style="text-decoration:none;">← Thoát</a>
    </div>

    <div class="ui-bottom">
      <div class="control-panel">
        <button class="control-btn" onclick="spawnObject('dna')">🧬 DNA Model</button>
        <button class="control-btn" onclick="spawnObject('cell')">🦠 Tế Bào</button>
        <button class="control-btn" onclick="spawnObject('virus')">🦠 Virus</button>
        <button class="control-btn" onclick="toggleAutoRotate()">🔄 Auto Rotate</button>
      </div>
    </div>
  </div>

  <div id="infoBox">
    <h3 id="infoTitle" style="color:var(--color-meta);margin-bottom:8px;">Model Info</h3>
    <p id="infoDesc" style="color:var(--color-text-dim);font-size:0.9rem;max-width:300px;line-height:1.6;margin-bottom:16px;">Description goes here.</p>
    <button class="control-btn" onclick="document.getElementById('infoBox').style.display='none'">Đóng</button>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let currentObject = null;
    let autoRotate = true;

    init();
    animate();

    function init() {
      // Scene
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050510, 0.02);

      // Camera
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 15);

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('metaverseCanvas'), antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xea80fc, 1);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      const spotLight = new THREE.SpotLight(0x00d4aa, 2);
      spotLight.position.set(-10, 10, -10);
      scene.add(spotLight);

      // Grid helper (Tron style)
      const grid = new THREE.GridHelper(50, 50, 0xea80fc, 0x222244);
      grid.position.y = -5;
      scene.add(grid);

      // Particles
      createParticles();

      // Default object
      spawnObject('dna');

      window.addEventListener('resize', onWindowResize);
    }

    function createParticles() {
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      for ( let i = 0; i < 1000; i ++ ) {
        vertices.push(
          (Math.random() - 0.5) * 50,
          (Math.random() - 0.5) * 50,
          (Math.random() - 0.5) * 50
        );
      }
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.5 });
      const particles = new THREE.Points(geometry, material);
      scene.add(particles);
    }

    function spawnObject(type) {
      if (currentObject) {
        scene.remove(currentObject);
      }

      const group = new THREE.Group();

      if (type === 'dna') {
        // Simple DNA double helix mock
        const material1 = new THREE.MeshPhongMaterial({ color: 0xea80fc, shininess: 100 });
        const material2 = new THREE.MeshPhongMaterial({ color: 0x00d4aa, shininess: 100 });
        for(let i=0; i<20; i++) {
          const y = (i - 10) * 0.5;
          const angle = i * 0.5;
          
          const sphere1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), material1);
          sphere1.position.set(Math.cos(angle)*2, y, Math.sin(angle)*2);
          
          const sphere2 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), material2);
          sphere2.position.set(Math.cos(angle+Math.PI)*2, y, Math.sin(angle+Math.PI)*2);
          
          // connecting rod
          const rodGeom = new THREE.CylinderGeometry(0.05, 0.05, 4);
          const rodMat = new THREE.MeshBasicMaterial({color: 0x555555});
          const rod = new THREE.Mesh(rodGeom, rodMat);
          rod.position.y = y;
          rod.rotation.z = Math.PI / 2;
          rod.rotation.y = -angle;

          group.add(sphere1);
          group.add(sphere2);
          group.add(rod);
        }
        showInfo('DNA Double Helix', 'Cấu trúc xoắn kép mang thông tin di truyền của mọi sinh vật sống. Khám phá trong môi trường 3D đa chiều.');
      } 
      else if (type === 'cell') {
        const geom = new THREE.SphereGeometry(3, 32, 32);
        const mat = new THREE.MeshPhongMaterial({ color: 0x00bcd4, transparent: true, opacity: 0.6, wireframe: true });
        const cell = new THREE.Mesh(geom, mat);
        
        const nucleus = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshPhongMaterial({color: 0xff4081}));
        
        group.add(cell);
        group.add(nucleus);
        showInfo('Tế bào động vật', 'Đơn vị cơ sở của sự sống. Khối cầu xanh là màng tế bào, khối hồng bên trong là nhân tế bào chứa DNA.');
      }
      else if (type === 'virus') {
        const geom = new THREE.IcosahedronGeometry(2, 0);
        const mat = new THREE.MeshPhongMaterial({ color: 0xff5252, flatShading: true });
        const core = new THREE.Mesh(geom, mat);
        
        // Spikes
        for(let i=0; i<geom.attributes.position.count; i++) {
          const vertex = new THREE.Vector3();
          vertex.fromBufferAttribute(geom.attributes.position, i);
          vertex.normalize().multiplyScalar(2.5);
          
          const spike = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.8), new THREE.MeshPhongMaterial({color: 0xffd740}));
          spike.position.copy(vertex);
          spike.lookAt(0,0,0);
          spike.rotateX(Math.PI/2);
          group.add(spike);
        }
        
        group.add(core);
        showInfo('Bacteriophage / Virus', 'Mô hình thể thực khuẩn hoặc virus với lớp vỏ capsid (đỏ) và các gai glycoprotein (vàng) dùng để bám vào tế bào chủ.');
      }

      currentObject = group;
      scene.add(currentObject);
    }

    function toggleAutoRotate() {
      autoRotate = !autoRotate;
    }

    function showInfo(title, desc) {
      document.getElementById('infoTitle').textContent = title;
      document.getElementById('infoDesc').textContent = desc;
      document.getElementById('infoBox').style.display = 'block';
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (currentObject && autoRotate) {
        currentObject.rotation.y += 0.005;
        currentObject.rotation.x += 0.002;
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
