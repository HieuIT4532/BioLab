<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cell Explorer 360° — Khám phá cấu tạo tế bào động vật, thực vật, vi khuẩn trong không gian 3D">
  <title>🔬 Cell Explorer 360° — BioLab</title>
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="styles/zone-explore.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
  <style>
    .platform-table td {
      vertical-align: top;
      padding: var(--space-xl) var(--space-md);
    }
    .sketchfab-embed-wrapper {
      box-shadow: var(--shadow-lg);
      border-radius: 12px;
      overflow: hidden;
    }
    @media (max-width: 992px) {
      .platform-table thead { display: none; }
      .platform-table tr { display: flex; flex-direction: column; gap: var(--space-md); margin-bottom: var(--space-2xl); border-bottom: 2px solid var(--glass-border); }
      .platform-table td { width: 100% !important; padding: var(--space-md) 0; }
    }
  </style>
</head>
<body class="zone-page">

  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <a href="../../index.html" class="navbar-brand">
      <div class="navbar-logo-icon">🧬</div>
      <span class="navbar-logo">BioLab</span>
    </a>
    <ul class="navbar-links" id="navLinks">
      <li><a href="../../index.html">Trang Chủ</a></li>
      <li><a href="index.html">Zone 1</a></li>
      <li><a href="cell-explorer.html" class="active">Cell Explorer</a></li>
      <li><a href="story-mode.html">Story Mode</a></li>
    </ul>
    <div class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Explorer Layout -->
  <div style="padding-top: var(--navbar-height);">
    <div class="container" style="padding-top: var(--space-lg);">
      <a href="index.html" class="back-btn">← Quay lại Zone 1</a>
    </div>

    <div class="container" style="padding-bottom: var(--space-3xl);">
      <div class="glass-card" style="margin-bottom: var(--space-xl); padding: var(--space-lg); text-align: center;">
        <h2 style="margin-bottom: var(--space-md);">🔬 <span class="text-gradient">Khám Phá Tế Bào 360°</span></h2>
        <p style="color: var(--color-text-muted); margin-bottom: var(--space-lg);">Chọn loại tế bào để xem mô hình 3D chi tiết và tương tác.</p>
        
        <div class="cell-tabs">
          <button class="cell-tab-btn active" data-cell="animal">🧫 Tế Bào Động Vật</button>
          <button class="cell-tab-btn" data-cell="plant">🌱 Tế Bào Thực Vật</button>
          <button class="cell-tab-btn" data-cell="bacteria">🦠 Vi Khuẩn</button>
        </div>
      </div>

      <div class="glass-card" style="padding: 0; overflow: hidden; height: 75vh; position: relative; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);" id="modelContainer">
        <iframe id="cellIframe" title="Cell Model" frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share src="https://sketchfab.com/models/b7d84e5f2d5e411fbb195ab2742f2256/embed" style="width: 100%; height: 100%; border: none;"></iframe>
        
        <!-- Fullscreen Toggle -->
        <button id="btnFullscreen" title="Toàn màn hình" style="position: absolute; bottom: 20px; right: 20px; width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(5px); z-index: 5; transition: all 0.3s;">
          ⛶
        </button>
        
        <!-- Loading Overlay -->
        <div id="loadingOverlay" style="position: absolute; inset: 0; background: var(--color-dark); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10;">
          <div class="navbar-logo-icon" style="margin-bottom: 20px; animation: pulse 1.5s infinite;">🧬</div>
          <p style="color: var(--color-primary); font-family: var(--font-heading); font-weight: 700; letter-spacing: 2px;">ĐANG TẢI MÔ HÌNH...</p>
        </div>
      </div>
    </div>
  </div>

  <style>
    .cell-tabs {
      display: flex;
      justify-content: center;
      gap: var(--space-md);
      flex-wrap: wrap;
    }
    .cell-tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      color: var(--color-text-muted);
      padding: 16px 32px;
      border-radius: var(--radius-xl);
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.4s var(--transition-base);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cell-tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--color-light);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-4px);
    }
    .cell-tab-btn.active {
      background: var(--gradient-primary);
      color: var(--color-dark);
      border-color: transparent;
      box-shadow: 0 10px 25px rgba(0, 212, 170, 0.4);
    }
    #modelContainer.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      height: 100vh !important;
      width: 100vw !important;
      border-radius: 0;
      margin: 0;
    }
    #btnFullscreen:hover {
      background: var(--color-primary);
      color: var(--color-dark);
      transform: scale(1.1);
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>

  <script src="scripts/cell-explorer.js"></script>
  <script src="../../scripts/main.js"></script>
</body>
</html>
