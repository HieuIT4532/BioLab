<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cell Explorer 360° — Khám phá cấu tạo tế bào động vật, thực vật, vi khuẩn trong không gian 3D">
  <title>🔬 Cell Explorer 360° — BioLab</title>
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="styles/zone-explore.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" defer></script>
</head>
<body class="zone-page">

  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <a href="../../index.html" class="navbar-brand">
      <div class="navbar-logo-icon">🧬</div>
      <span class="navbar-logo">BioLab</span>
    </a>
    <ul class="navbar-links" id="navLinks">
      <li><a href="../../index.html">Trang Chủ</a></li>
      <li><a href="index.html">Zone 1</a></li>
      <li><a href="cell-explorer.html" class="active">Cell Explorer</a></li>
      <li><a href="story-mode.html">Story Mode</a></li>
    </ul>
    <div class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Explorer Layout -->
  <div style="padding-top: var(--navbar-height);">
    <div class="container" style="padding-top: var(--space-lg);">
      <a href="index.html" class="back-btn">← Quay lại Zone 1</a>
    </div>

    <div class="explorer-layout">
      <!-- Sidebar: Cell Type Selection -->
      <div class="explorer-sidebar">
        <button class="cell-type-btn active" data-cell="animal">
          <span class="cell-emoji">🧫</span>
          <div>
            <span class="cell-name">Tế Bào Động Vật</span>
            <span class="cell-latin">Animal Cell</span>
          </div>
        </button>
        <button class="cell-type-btn" data-cell="plant">
          <span class="cell-emoji">🌱</span>
          <div>
            <span class="cell-name">Tế Bào Thực Vật</span>
            <span class="cell-latin">Plant Cell</span>
          </div>
        </button>
        <button class="cell-type-btn" data-cell="bacteria">
          <span class="cell-emoji">🦠</span>
          <div>
            <span class="cell-name">Vi Khuẩn</span>
            <span class="cell-latin">Bacteria (Prokaryote)</span>
          </div>
        </button>
      </div>

      <!-- 3D Viewport -->
      <div class="explorer-viewport" id="cellViewport">
        <canvas class="viewport-canvas" id="cellCanvas"></canvas>
        <div class="viewport-label" id="viewportLabel">🧫 Tế Bào Động Vật</div>

        <div class="viewport-controls">
          <button class="viewport-ctrl-btn" id="btnRotate" title="Tự động xoay">🔄</button>
          <button class="viewport-ctrl-btn" id="btnZoomIn" title="Phóng to">🔍</button>
          <button class="viewport-ctrl-btn" id="btnZoomOut" title="Thu nhỏ">🔎</button>
          <button class="viewport-ctrl-btn" id="btnReset" title="Reset">↺</button>
        </div>
      </div>

      <!-- Info Panel -->
      <div class="explorer-info">
        <div class="info-panel">
          <h3>📋 Bào Quan</h3>
          <div class="organelle-list" id="organelleList">
            <!-- Populated by JS -->
          </div>
        </div>

        <div class="organelle-detail" id="organelleDetail">
          <h4 id="detailTitle">Chọn một bào quan</h4>
          <p id="detailDesc">Click vào bào quan trong danh sách hoặc trên mô hình 3D để xem chi tiết.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/cell-explorer.js"></script>
  <script src="../../scripts/main.js"></script>
</body>
</html>
