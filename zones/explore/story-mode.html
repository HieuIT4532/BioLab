<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hành trình miễn dịch — Bạn là tế bào bạch cầu, hãy bảo vệ cơ thể chống virus!">
  <title>⚔️ Hành Trình Miễn Dịch — BioLab</title>
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="styles/zone-explore.css">
  <link rel="stylesheet" href="styles/story.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
</head>
<body class="zone-page">

  <!-- Navbar -->
  <nav class="navbar scrolled" id="navbar">
    <a href="../../index.html" class="navbar-brand">
      <div class="navbar-logo-icon">🧬</div>
      <span class="navbar-logo">BioLab</span>
    </a>
    <ul class="navbar-links" id="navLinks">
      <li><a href="../../index.html">Trang Chủ</a></li>
      <li><a href="index.html">Zone 1</a></li>
      <li><a href="cell-explorer.html">Cell Explorer</a></li>
      <li><a href="story-mode.html" class="active">Story Mode</a></li>
    </ul>
    <div class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </div>
  </nav>

  <!-- Score -->
  <div class="score-display" id="scoreDisplay">🧬 Điểm: <span id="scoreValue">0</span>/50</div>

  <!-- Story Container -->
  <div style="padding-top: var(--navbar-height);">
    <div class="story-container">
      <div class="container" style="margin-bottom: var(--space-lg);">
        <a href="index.html" class="back-btn">← Quay lại Zone 1</a>
      </div>

      <!-- Progress -->
      <div class="story-progress" id="storyProgress">
        <div class="progress-step" data-step="0"></div>
        <div class="progress-step" data-step="1"></div>
        <div class="progress-step" data-step="2"></div>
        <div class="progress-step" data-step="3"></div>
        <div class="progress-step" data-step="4"></div>
      </div>

      <!-- Story Content (populated by JS) -->
      <div id="storyContent"></div>

      <!-- Completion Screen -->
      <div class="story-complete" id="storyComplete">
        <div class="completion-badge">🏆</div>
        <h2>Sứ Mệnh Hoàn Thành!</h2>
        <p class="final-score" id="finalScore"></p>
        <div class="completion-stats">
          <div class="completion-stat">
            <div class="number" id="correctCount">0</div>
            <div class="label">Đáp án đúng</div>
          </div>
          <div class="completion-stat">
            <div class="number">5</div>
            <div class="label">Chương</div>
          </div>
          <div class="completion-stat">
            <div class="number" id="badgeName">🛡️</div>
            <div class="label">Badge</div>
          </div>
        </div>
        <p style="color: var(--color-text-muted); margin-bottom: var(--space-xl);">
          Bạn đã hoàn thành hành trình bảo vệ cơ thể!
          Kiến thức về hệ miễn dịch của bạn thật tuyệt vời.
        </p>
        <a href="index.html" class="btn btn-primary">← Về Zone 1</a>
        <button class="btn btn-ghost" onclick="location.reload()">🔄 Chơi lại</button>
      </div>
    </div>
  </div>

  <script src="scripts/story-engine.js"></script>
  <script src="../../scripts/main.js"></script>
</body>
</html>
