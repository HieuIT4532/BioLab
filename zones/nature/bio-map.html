<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗺️ Interactive Bio Map — BioVerse</title>
  <link rel="stylesheet" href="../../styles/variables.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="../../styles/components.css">
  <link rel="stylesheet" href="../explore/styles/zone-explore.css">
  <link rel="stylesheet" href="../../styles/zone-shared.css">
  <link rel="stylesheet" href="../../styles/gamification.css">
  <link rel="stylesheet" href="../../styles/ai-tutor.css">
  <link rel="stylesheet" href="../../styles/responsive.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="zone-page">
  <nav class="navbar scrolled" id="navbar">
    <a href="../../index.html" class="navbar-brand">
      <div class="navbar-logo-icon">🧬</div><span class="navbar-logo">BioVerse</span>
    </a>
    <ul class="navbar-links" id="navLinks">
      <li><a href="../../index.html">Trang Chủ</a></li>
      <li><a href="index.html">Citizen Science</a></li>
      <li><a href="field-survey.html">Khảo Sát</a></li>
      <li><a href="bio-map.html" class="active">Bản Đồ</a></li>
    </ul>
    <div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
  </nav>

  <div style="padding-top: var(--navbar-height);">
    <div class="container" style="padding-top: var(--space-lg);">
      <a href="index.html" class="back-btn">← Quay lại Citizen Science</a>
      <h2>🗺️ <span class="text-gradient">Interactive Bio Map</span></h2>
      <p style="color: var(--color-text-muted); margin-bottom: var(--space-md);">
        Bản đồ sinh học tương tác — hiển thị tất cả quan sát thực địa trên bản đồ.
      </p>
    </div>

    <!-- Filter Bar -->
    <div class="container" style="margin-bottom: var(--space-md);">
      <div style="display:flex;gap:var(--space-sm);flex-wrap:wrap;align-items:center;">
        <select class="zone-select" id="filterType" style="width:auto;min-width:160px;">
          <option value="all">🌍 Tất cả</option>
          <option value="plant">🌱 Thực vật</option>
          <option value="animal">🐦 Động vật</option>
          <option value="fungi">🍄 Nấm</option>
          <option value="insect">🦋 Côn trùng</option>
          <option value="aquatic">🐟 Thủy sinh</option>
        </select>
        <span style="font-size:var(--fs-small);color:var(--color-text-muted);" id="mapStats">0 quan sát</span>
        <button class="zone-btn zone-btn-ghost" id="btnAddSample" style="margin-left:auto;">+ Thêm dữ liệu mẫu</button>
      </div>
    </div>

    <!-- Map -->
    <div class="container" style="margin-bottom: var(--space-xl);">
      <div class="map-container" id="bioMap"></div>
    </div>

    <!-- Stats -->
    <div class="container" style="margin-bottom: var(--space-2xl);">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--space-md);">
        <div class="vis-box" style="text-align:center;padding:var(--space-lg);">
          <div style="font-size:2rem;margin-bottom:4px;" id="statTotal">0</div>
          <div style="font-size:var(--fs-xs);color:var(--color-text-muted);">Tổng quan sát</div>
        </div>
        <div class="vis-box" style="text-align:center;padding:var(--space-lg);">
          <div style="font-size:2rem;margin-bottom:4px;" id="statSpecies">0</div>
          <div style="font-size:var(--fs-xs);color:var(--color-text-muted);">Loài khác nhau</div>
        </div>
        <div class="vis-box" style="text-align:center;padding:var(--space-lg);">
          <div style="font-size:2rem;margin-bottom:4px;" id="statLocations">0</div>
          <div style="font-size:var(--fs-xs);color:var(--color-text-muted);">Địa điểm</div>
        </div>
        <div class="vis-box" style="text-align:center;padding:var(--space-lg);">
          <div style="font-size:2rem;margin-bottom:4px;" id="statDays">0</div>
          <div style="font-size:var(--fs-xs);color:var(--color-text-muted);">Ngày hoạt động</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../scripts/simulation-engine.js"></script>
  <script src="../../scripts/data-layer.js"></script>
  <script src="../../scripts/gamification.js"></script>
  <script src="../../scripts/ai-service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const STORAGE_KEY = 'bioverse_observations';
      const typeEmoji = { plant: '🌱', animal: '🐦', fungi: '🍄', insect: '🦋', aquatic: '🐟', other: '📦' };
      const typeColors = { plant: '#00D4AA', animal: '#FF4081', fungi: '#E040FB', insect: '#FFD740', aquatic: '#00BCD4', other: '#8892B0' };

      // Init map centered on Vietnam
      const map = L.map('bioMap').setView([16.0, 106.0], 6);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO',
        maxZoom: 19
      }).addTo(map);

      let markers = [];

      function loadObservations(filter = 'all') {
        let obs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (filter !== 'all') obs = obs.filter(o => o.type === filter);

        // Clear markers
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        // Add markers
        obs.forEach(o => {
          if (o.lat && o.lng) {
            const marker = L.circleMarker([o.lat, o.lng], {
              radius: 8,
              fillColor: typeColors[o.type] || '#8892B0',
              color: '#fff',
              weight: 1,
              fillOpacity: 0.8
            }).addTo(map);

            marker.bindPopup(`
              <div style="font-family:Inter,sans-serif;">
                <strong>${typeEmoji[o.type] || '📦'} ${o.species}</strong><br>
                📍 ${o.location || 'N/A'}<br>
                🔢 x${o.count}<br>
                📅 ${new Date(o.date).toLocaleDateString('vi-VN')}<br>
                ${o.notes ? '📝 ' + o.notes.substring(0, 60) + '...' : ''}
              </div>
            `);

            markers.push(marker);
          }
        });

        // Fit bounds
        if (markers.length > 0) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.2));
        }

        // Update stats
        const allObs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        document.getElementById('statTotal').textContent = allObs.length;
        document.getElementById('statSpecies').textContent = new Set(allObs.map(o => o.species)).size;
        document.getElementById('statLocations').textContent = new Set(allObs.map(o => o.location).filter(Boolean)).size;
        document.getElementById('statDays').textContent = new Set(allObs.map(o => new Date(o.date).toDateString())).size;
        document.getElementById('mapStats').textContent = `${obs.length} quan sát`;
      }

      // Filter
      document.getElementById('filterType').addEventListener('change', function() {
        loadObservations(this.value);
      });

      // Sample data
      document.getElementById('btnAddSample').addEventListener('click', () => {
        const sampleData = [
          { species: 'Cây bàng', type: 'plant', count: 3, location: 'Hồ Hoàn Kiếm, Hà Nội', lat: 21.0285, lng: 105.8542, temperature: '28', humidity: '75', notes: 'Cây lớn, lá xanh tốt', date: new Date().toISOString() },
          { species: 'Chim sẻ', type: 'animal', count: 12, location: 'Công viên Thống Nhất', lat: 21.0118, lng: 105.8436, temperature: '30', humidity: '70', notes: 'Đàn chim kiếm ăn buổi sáng', date: new Date().toISOString() },
          { species: 'Bướm phượng', type: 'insect', count: 5, location: 'Vườn Bách Thảo', lat: 21.0422, lng: 105.8325, temperature: '27', humidity: '80', notes: 'Bay quanh hoa dâm bụt', date: new Date().toISOString() },
          { species: 'Nấm mỡ', type: 'fungi', count: 8, location: 'Ba Vì, Hà Nội', lat: 21.0761, lng: 105.3716, temperature: '24', humidity: '90', notes: 'Mọc trên thân cây mục', date: new Date().toISOString() },
          { species: 'Rong đuôi chó', type: 'aquatic', count: 20, location: 'Hồ Tây', lat: 21.0545, lng: 105.8198, temperature: '26', humidity: '85', notes: 'Phủ kín mặt nước ven bờ', date: new Date().toISOString() },
          { species: 'Cây phượng vĩ', type: 'plant', count: 6, location: 'TP Hồ Chí Minh', lat: 10.7769, lng: 106.7009, temperature: '33', humidity: '65', notes: 'Đang ra hoa đỏ rực', date: new Date().toISOString() },
          { species: 'Cá rô phi', type: 'aquatic', count: 15, location: 'Sông Hương, Huế', lat: 16.4637, lng: 107.5909, temperature: '29', humidity: '78', notes: 'Quan sát gần cầu Trường Tiền', date: new Date().toISOString() },
          { species: 'Sóc bụng đỏ', type: 'animal', count: 2, location: 'Cúc Phương, Ninh Bình', lat: 20.2539, lng: 105.7139, temperature: '25', humidity: '88', notes: 'Trên ngọn cây', date: new Date().toISOString() }
        ];

        sampleData.forEach(s => s.id = Date.now() + Math.random());
        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...existing, ...sampleData]));
        loadObservations();

        if (window.BioVerseData) {
          BioVerseData.Profile.addXP(10, 'Thêm dữ liệu mẫu');
        }
      });

      loadObservations();

      if (window.BioVerseData) {
        BioVerseData.Analytics.track({ type: 'module_visit', module: 'bio_map' });
        BioVerseData.Profile.updateZoneProgress('nature', 'bio_map', 50);
      }
    });
  </script>
  <script src="../../scripts/main.js"></script>
</body>
</html>
