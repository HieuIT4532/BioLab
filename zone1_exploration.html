<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Khám Phá | BioLab v2</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/zones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="zone-page">
    <div class="app-container">
        <nav class="glass-nav">
            <div class="nav-brand">
                <a href="index.html" style="color: inherit; text-decoration: none;"><i class="fas fa-arrow-left"></i> QUAY LẠI</a>
            </div>
            <div class="zone-title">KHU KHÁM PHÁ</div>
        </nav>

        <main class="zone-layout">
            <aside class="zone-sidebar glass-panel">
                <div class="sidebar-section">
                    <h3><i class="fas fa-microscope"></i> Kính Hiển Vi Ảo</h3>
                    <div class="control-group">
                        <label>Chọn mẫu vật</label>
                        <div class="specimen-list">
                            <button class="specimen-btn active" data-specimen="plant">Tế bào thực vật</button>
                            <button class="specimen-btn" data-specimen="animal">Tế bào động vật</button>
                            <button class="specimen-btn" data-specimen="bacteria">Vi khuẩn</button>
                        </div>
                    </div>
                    <div class="control-group">
                        <label>Độ phóng đại</label>
                        <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1">
                        <span id="zoom-val">100x</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3><i class="fas fa-info-circle"></i> Chi tiết mẫu vật</h3>
                    <div id="specimen-info" class="info-box">
                        <h4 id="info-title">Tế bào thực vật</h4>
                        <p id="info-desc">Có thành tế bào cellulose và lục lạp thực hiện quang hợp.</p>
                        <ul id="info-parts">
                            <li>Thành tế bào</li>
                            <li>Lục lạp</li>
                            <li>Không bào lớn</li>
                        </ul>
                    </div>
                </div>
            </aside>

            <section class="zone-display">
                <div class="display-card glass-panel">
                    <div class="microscope-view">
                        <div class="microscope-lens">
                            <div id="specimen-image" class="zoom-image" style="background-image: url('assets/images/cells/plant_cell.png')"></div>
                            <div class="lens-glare"></div>
                        </div>
                        <div class="microscope-overlay">
                            <div class="scale-bar">10μm</div>
                        </div>
                    </div>
                </div>

                <div class="display-grid">
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-vial"></i> Tiêu bản vật lý</h3>
                        <p class="small">Bộ sưu tập mẫu vật hiếm từ viện bảo tàng sinh học.</p>
                        <div class="specimen-cards-mini">
                            <div class="mini-card">🌿</div>
                            <div class="mini-card">🦟</div>
                            <div class="mini-card">🍄</div>
                        </div>
                    </div>
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-cube"></i> Mô hình Terrarium</h3>
                        <div class="terrarium-preview">
                            <div class="terrarium-sphere">
                                <div class="eco-system">🌱💧</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <style>
        .specimen-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .specimen-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--light);
            padding: 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .specimen-btn.active, .specimen-btn:hover {
            background: var(--primary);
            color: var(--dark);
            border-color: var(--primary);
        }
        .microscope-view {
            height: 450px;
            background: #000;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .microscope-lens {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 15px solid #1e293b;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }
        .zoom-image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.2s ease-out;
        }
        .lens-glare {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .scale-bar {
            position: absolute;
            bottom: 20px; right: 20px;
            color: #fff; border-bottom: 2px solid #fff;
            padding: 0 10px; font-size: 0.7rem;
        }
        .specimen-cards-mini { display: flex; gap: 1rem; margin-top: 1rem; }
        .mini-card {
            width: 50px; height: 50px; background: rgba(255,255,255,0.05);
            border-radius: 10px; display: flex; justify-content: center;
            align-items: center; font-size: 1.5rem;
        }
        .terrarium-sphere {
            width: 100px; height: 100px; border-radius: 50%;
            background: rgba(16,185,129,0.1); border: 2px solid var(--primary);
            margin: 1rem auto; display: flex; justify-content: center;
            align-items: center; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const zoomSlider = document.getElementById('zoom-slider');
            const zoomVal = document.getElementById('zoom-val');
            const img = document.getElementById('specimen-image');
            const specimenBtns = document.querySelectorAll('.specimen-btn');
            
            const data = {
                plant: { title: 'Tế bào thực vật', desc: 'Có thành tế bào cellulose và lục lạp thực hiện quang hợp.', parts: ['Thành tế bào', 'Lục lạp', 'Không bào lớn'], img: 'assets/images/cells/plant_cell.png' },
                animal: { title: 'Tế bào động vật', desc: 'Không có thành tế bào, có trung thể tham gia phân bào.', parts: ['Màng sinh chất', 'Ti thể', 'Trung thể'], img: 'assets/images/cells/animal_cell.png' },
                bacteria: { title: 'Vi khuẩn', desc: 'Tế bào nhân sơ, cấu trúc đơn giản, không có màng nhân.', parts: ['Vỏ nhầy', 'Vùng nhân', 'Roi'], img: 'assets/images/cells/bacteria.png' }
            };

            zoomSlider.addEventListener('input', () => {
                const zoom = zoomSlider.value;
                img.style.transform = `scale(${zoom})`;
                zoomVal.textContent = (zoom * 100).toFixed(0) + 'x';
            });

            specimenBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    specimenBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const spec = data[btn.dataset.specimen];
                    document.getElementById('info-title').textContent = spec.title;
                    document.getElementById('info-desc').textContent = spec.desc;
                    document.getElementById('specimen-image').style.backgroundImage = `url('${spec.img}')`;
                    
                    const list = document.getElementById('info-parts');
                    list.innerHTML = spec.parts.map(p => `<li>${p}</li>`).join('');
                });
            });
        });
    </script>
</body>
</html>
