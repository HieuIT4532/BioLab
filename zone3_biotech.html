<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Công Nghệ Sinh Học | BioLab v2</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/zones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="zone-page">
    <div class="app-container">
        <nav class="glass-nav">
            <div class="nav-brand">
                <a href="index.html" style="color: inherit; text-decoration: none;"><i class="fas fa-arrow-left"></i> QUAY LẠI</a>
            </div>
            <div class="zone-title">KHU CÔNG NGHỆ SINH HỌC</div>
        </nav>

        <main class="zone-layout">
            <aside class="zone-sidebar glass-panel">
                <div class="sidebar-section">
                    <h3><i class="fas fa-dna"></i> Máy Luân Nhiệt PCR</h3>
                    <div class="control-group">
                        <label>Số chu kỳ (n)</label>
                        <input type="range" id="pcr-cycles" min="1" max="35" value="1">
                        <span id="cycle-val">1 chu kỳ</span>
                    </div>
                    <div class="control-group">
                        <label>Nhiệt độ biến tính</label>
                        <input type="number" value="95" class="glass-input" readonly>
                    </div>
                    <button id="run-pcr" class="btn-primary">BẮT ĐẦU KHUẾCH ĐẠI</button>
                </div>

                <div class="sidebar-section">
                    <h3><i class="fas fa-layer-group"></i> Điện di Gel</h3>
                    <div class="control-group">
                        <label>Điện thế (V)</label>
                        <input type="range" min="50" max="150" value="100">
                    </div>
                    <button id="run-gel" class="btn-secondary">CHẠY ĐIỆN DI</button>
                </div>
            </aside>

            <section class="zone-display">
                <div class="display-card glass-panel">
                    <div class="card-header">
                        <h2>Kết quả khuếch đại DNA</h2>
                        <span class="badge">PCR SIMULATOR</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="pcrChart"></canvas>
                    </div>
                    <div class="data-insights">
                        <div class="insight-item">
                            <label>Số bản sao DNA</label>
                            <span id="copy-count">2</span>
                        </div>
                        <div class="insight-item">
                            <label>Công thức</label>
                            <span style="font-size: 0.8rem;">2ⁿ copies</span>
                        </div>
                    </div>
                </div>

                <div class="display-grid">
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-microscope"></i> CRISPR-Cas9</h3>
                        <p class="small">Mô phỏng cắt dán hệ gen đặc hiệu.</p>
                        <div class="crispr-anim">
                            <div class="dna-strand">🧬</div>
                            <div class="cas9-scissors">✂️</div>
                        </div>
                    </div>
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-flask"></i> Nuôi cấy mô</h3>
                        <div class="tissue-culture">
                            <div class="petri-dish">🦠🌱</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <style>
        .glass-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 0.5rem; border-radius: 8px; }
        .crispr-anim { height: 100px; display: flex; justify-content: center; align-items: center; position: relative; font-size: 2rem; }
        .cas9-scissors { position: absolute; animation: snip 2s infinite; }
        @keyframes snip { 0% { transform: translate(-20px, 0); } 50% { transform: translate(10px, 0); } 100% { transform: translate(-20px, 0); } }
        .tissue-culture { text-align: center; font-size: 2.5rem; margin-top: 1rem; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('pcrChart').getContext('2d');
            const cycleSlider = document.getElementById('pcr-cycles');
            const cycleVal = document.getElementById('cycle-val');
            const copyCount = document.getElementById('copy-count');
            let pcrChart;

            const updatePCR = () => {
                const n = parseInt(cycleSlider.value);
                cycleVal.textContent = n + ' chu kỳ';
                const copies = Math.pow(2, n);
                copyCount.textContent = copies.toLocaleString();

                const labels = [];
                const data = [];
                for (let i = 1; i <= n; i++) {
                    labels.push(i);
                    data.push(Math.pow(2, i));
                }

                if (pcrChart) pcrChart.destroy();
                pcrChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Số bản sao DNA',
                            data: data,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { type: 'logarithmic', grid: { color: 'rgba(255,255,255,0.05)' } },
                            x: { title: { display: true, text: 'Số chu kỳ (n)' } }
                        }
                    }
                });
            };

            cycleSlider.addEventListener('input', updatePCR);
            updatePCR();
        });
    </script>
</body>
</html>
