<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Thí Nghiệm | BioLab v2</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/zones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="zone-page">
    <div class="app-container">
        <nav class="glass-nav">
            <div class="nav-brand">
                <a href="index.html" style="color: inherit; text-decoration: none;"><i class="fas fa-arrow-left"></i> QUAY LẠI</a>
            </div>
            <div class="zone-title">KHU THÍ NGHIỆM</div>
        </nav>

        <main class="zone-layout">
            <aside class="zone-sidebar glass-panel">
                <div class="sidebar-section">
                    <h3><i class="fas fa-flask"></i> Enzyme & Động Học</h3>
                    <div class="control-group">
                        <label>Nhiệt độ (°C)</label>
                        <input type="range" id="temp-slider" min="0" max="100" value="37">
                        <span id="temp-val">37°C</span>
                    </div>
                    <div class="control-group">
                        <label>Độ pH</label>
                        <input type="range" id="ph-slider" min="0" max="14" step="0.1" value="7">
                        <span id="ph-val">7.0</span>
                    </div>
                    <div class="control-group">
                        <label>Nồng độ cơ chất [S] (mM)</label>
                        <input type="range" id="substrate-slider" min="0.1" max="20" step="0.1" value="5">
                        <span id="substrate-val">5.0 mM</span>
                    </div>
                    <div class="control-group">
                        <label>Loại Enzyme</label>
                        <select id="enzyme-type" class="glass-select">
                            <option value="amylase">Amylase (Nước bọt)</option>
                            <option value="pepsin">Pepsin (Dạ dày)</option>
                            <option value="catalase">Catalase (Gan)</option>
                        </select>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3><i class="fas fa-sun"></i> Quang Hợp</h3>
                    <div class="control-group">
                        <label>Cường độ ánh sáng (%)</label>
                        <input type="range" id="light-slider" min="0" max="100" value="60">
                        <span id="light-val">60%</span>
                    </div>
                    <div class="control-group">
                        <label>Nồng độ CO2 (ppm)</label>
                        <input type="range" id="co2-slider" min="100" max="1200" value="400">
                        <span id="co2-val">400 ppm</span>
                    </div>
                </div>
            </aside>

            <section class="zone-display">
                <div class="display-card glass-panel">
                    <div class="card-header">
                        <h2>Hoạt Tính Enzyme (Michaelis-Menten)</h2>
                        <span class="badge">SIMULATOR V1.2</span>
                    </div>
                    <div class="chart-container">
                        <canvas id="enzymeChart"></canvas>
                    </div>
                    <div class="data-insights">
                        <div class="insight-item">
                            <label>Vận tốc (V)</label>
                            <span id="velocity-val">0.00 μM/s</span>
                        </div>
                        <div class="insight-item">
                            <label>Hiệu suất</label>
                            <span id="efficiency-val">0%</span>
                        </div>
                    </div>
                </div>

                <div class="display-grid">
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-dna"></i> Di Truyền Mendel</h3>
                        <p class="small">Bảng Punnett và tỉ lệ kiểu hình cho phép lai một tính trạng.</p>
                        <div class="punnett-box">
                             <div class="punnett-input">
                                <input type="text" id="parent1" value="Aa" maxlength="2">
                                <span>×</span>
                                <input type="text" id="parent2" value="Aa" maxlength="2">
                             </div>
                             <button id="calc-punnett" class="btn-outline btn-sm">TÍNH TOÁN</button>
                        </div>
                    </div>
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-chart-area"></i> Bão Hòa Quang Hợp</h3>
                        <canvas id="photoChart" height="150"></canvas>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <style>
        .glass-select {
            width: 100%;
            padding: 0.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: var(--light);
            border-radius: 8px;
            outline: none;
        }
        .punnett-box {
            margin-top: 1rem;
            text-align: center;
        }
        .punnett-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .punnett-input input {
            width: 50px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--primary);
            color: var(--light);
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 4px;
        }
        .btn-sm { padding: 0.4rem; font-size: 0.6rem; }
    </style>
    <script src="scripts/simulations/experiment.js"></script>
</body>
</html>
