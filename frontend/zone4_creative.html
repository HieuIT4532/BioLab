<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Dự Án & Sáng Tạo | BioLab v2</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/zones.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="zone-page">
    <div class="app-container">
        <nav class="glass-nav">
            <div class="nav-brand">
                <a href="index.html" style="color: inherit; text-decoration: none;"><i class="fas fa-arrow-left"></i> QUAY LẠI</a>
            </div>
            <div class="zone-title">KHU DỰ ÁN & SÁNG TẠO</div>
        </nav>

        <main class="zone-layout">
            <aside class="zone-sidebar glass-panel">
                <div class="sidebar-section">
                    <h3><i class="fas fa-palette"></i> Poster Builder</h3>
                    <div class="control-group">
                        <label>Tiêu đề dự án</label>
                        <input type="text" id="poster-title" placeholder="Nhập tiêu đề..." class="glass-input">
                    </div>
                    <div class="control-group">
                        <label>Màu chủ đạo</label>
                        <input type="color" id="poster-color" value="#10b981">
                    </div>
                    <button class="btn-primary">XUẤT FILE PDF</button>
                </div>

                <div class="sidebar-section">
                    <h3><i class="fas fa-cube"></i> Mô hình 3D</h3>
                    <div class="model-select">
                        <button class="btn-outline active">DNA Helix</button>
                        <button class="btn-outline">Protein Folding</button>
                        <button class="btn-outline">Virus Capsule</button>
                    </div>
                </div>
            </aside>

            <section class="zone-display">
                <div class="display-card glass-panel" style="height: 500px;">
                    <div class="poster-preview" id="poster-area">
                        <h1 id="preview-title">DỰ ÁN NGHIÊN CỨU SINH HỌC</h1>
                        <div class="poster-grid">
                            <div class="poster-box">Tóm tắt</div>
                            <div class="poster-box">Phương pháp</div>
                            <div class="poster-box">Kết quả</div>
                            <div class="poster-box">Kết luận</div>
                        </div>
                    </div>
                </div>

                <div class="display-grid">
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-video"></i> Video trình bày</h3>
                        <div class="video-placeholder">
                            <i class="fas fa-play-circle"></i>
                        </div>
                    </div>
                    <div class="display-card glass-panel">
                        <h3><i class="fas fa-users"></i> Cộng tác nhóm</h3>
                        <p class="small">Làm việc trực tuyến cùng đồng đội.</p>
                        <div class="avatars">
                            <div class="avatar">👤</div>
                            <div class="avatar">👤</div>
                            <div class="avatar">👤</div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <style>
        .glass-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; padding: 0.5rem; border-radius: 8px; }
        .model-select { display: flex; flex-direction: column; gap: 0.5rem; }
        .poster-preview {
            background: #fff; color: #000; height: 100%; border-radius: 10px;
            padding: 2rem; display: flex; flex-direction: column; gap: 1rem;
            transition: border 0.3s;
        }
        .poster-preview h1 { font-family: var(--font-header); font-size: 1.5rem; text-align: center; border-bottom: 2px solid #000; padding-bottom: 1rem; }
        .poster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; height: 100%; }
        .poster-box { border: 1px dashed #ccc; padding: 1rem; font-size: 0.7rem; color: #666; }
        .video-placeholder { height: 120px; display: flex; justify-content: center; align-items: center; font-size: 3rem; color: var(--secondary); }
        .avatars { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .avatar { width: 35px; height: 35px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
    </style>
    <script>
        document.getElementById('poster-title').addEventListener('input', (e) => {
            document.getElementById('preview-title').textContent = e.target.value || 'DỰ ÁN NGHIÊN CỨU SINH HỌC';
        });
        document.getElementById('poster-color').addEventListener('input', (e) => {
            document.getElementById('poster-area').style.borderTop = `10px solid ${e.target.value}`;
        });
    </script>
</body>
</html>
